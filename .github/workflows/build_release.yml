name: Build runner binary (Release)

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-ppc64le
            runner_owner: "ppc64le-hosted"
          - os: ubuntu-24.04-s390x
            runner_owner: "s390x-hosted"
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      # Latest release + release patch; falls back to main + main patch if that fails to patch or build
      - name: Cloning, patching and building runner
        run: |
          sudo bash scripts/helpers/build-runner.sh https://github.com/actions/runner.git \
            patches/runner-sdk8-$(uname -m).patch patches/runner-main-sdk8-$(uname -m).patch

      - name: Testing runner binary
        run: |
          cd /tmp/runner/src
          sudo ./dev.sh test

      - name: Installing runner
        run: |
          sudo mkdir -p /opt/runner-cache
          sudo tar -xf /tmp/runner/_package/*.tar.gz -C /opt/runner-cache
          /opt/runner-cache/config.sh --version
