config: {}
cluster: null
networks:
- config:
    bridge.mtu: "1460"
    ipv4.address: auto
    # Nested in an unprivileged container: the kernel rejects the
    # "udp checksum set 0" rule Incus adds with the IPv4 firewall (EPERM).
    ipv4.firewall: "false"
    ipv6.address: auto
  description: "Incus network for ppc64le"
  name: incusbr0
  type: bridge
  project: default
storage_pools:
- config: {}
  description: "Incus storage pool for ppc64le"
  name: default
  driver: dir
profiles:
- config:
    security.syscalls.deny_default: "false"
    security.nesting: "true"
  description: "Incus default profile for ppc64le"
  devices:
    eth0:
      name: eth0
      network: incusbr0
      type: nic
    root:
      path: /
      pool: default
      type: disk
  name: default
